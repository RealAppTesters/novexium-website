<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novexium</title>
</head>
<body style="margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: #09090B;">
    <div style="max-width: 600px; margin: 0 auto; padding: 40px 20px;">
        <!-- Header -->
        <div style="text-align: center; margin-bottom: 32px;">
            <svg style="display: inline-block;" width="48" height="48" viewBox="0 0 32 32" fill="none">
                <rect width="32" height="32" rx="8" fill="#4F46E5"/>
                <path d="M8 24L16 8L24 24" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
                <path d="M12 18L20 18" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
            </svg>
            <div style="font-size: 24px; font-weight: 700; color: #FFFFFF; margin-top: 8px;">Novexium</div>
        </div>
        
        <!-- Content -->
        <div style="background: #111113; border: 1px solid #27272A; border-radius: 16px; padding: 40px; color: #FFFFFF;">
            {% block content %}
            {% endblock %}
        </div>
        
        <!-- Footer -->
        <div style="text-align: center; margin-top: 32px; font-size: 14px; color: #71717A;">
            <p>&copy; {% now 'Y' %} Novexium. All rights reserved.</p>
            <p style="margin-top: 8px;">
                <a href="{{ app_url }}/privacy" style="color: #71717A; text-decoration: none; margin: 0 8px;">Privacy Policy</a>
                <span style="color: #27272A;">|</span>
                <a href="{{ app_url }}/terms" style="color: #71717A; text-decoration: none; margin: 0 8px;">Terms of Service</a>
            </p>
        </div>
    </div>
</body>
</html>
