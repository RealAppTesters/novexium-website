{% extends "base/public.html" %}

{% block title %}Reset Password — Novexium{% endblock %}

{% block page_content %}
<div class="auth-page auth-small">
    <div class="auth-container">
        <div class="auth-header">
            <a href="/" class="auth-logo">
                <svg class="logo-icon" viewBox="0 0 32 32" fill="none">
                    <rect width="32" height="32" rx="8" fill="#4F46E5"/>
                    <path d="M8 24L16 8L24 24" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
                    <path d="M12 18L20 18" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
                </svg>
                <span class="logo-text">Novexium</span>
            </a>
            <h1 class="auth-title">Reset your password</h1>
            <p class="auth-subtitle">
                We'll send you a link to reset your password
            </p>
        </div>
        
        <form class="auth-form" method="POST" action="/auth/forgot-password" id="forgotPasswordForm" novalidate>
            <div class="form-group">
                <label class="form-label" for="email">Email Address</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    class="input" 
                    placeholder="you@example.com"
                    required
                    autofocus
                >
            </div>
            
            <button type="submit" class="btn-primary btn-block btn-lg" id="resetButton">
                Send Reset Link
            </button>
        </form>
        
        <div class="auth-footer">
            <p>
                <a href="/auth/login">← Back to login</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', path='js/auth.js') }}"></script>
{% endblock %}
