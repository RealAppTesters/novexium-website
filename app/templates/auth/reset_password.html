{% extends "base/public.html" %}

{% block title %}Create New Password — Novexium{% endblock %}

{% block page_content %}
<div class="auth-page auth-small">
    <div class="auth-container">
        <div class="auth-header">
            <a href="/" class="auth-logo">
                <svg class="logo-icon" viewBox="0 0 32 32" fill="none">
                    <rect width="32" height="32" rx="8" fill="#4F46E5"/>
                    <path d="M8 24L16 8L24 24" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
                    <path d="M12 18L20 18" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
                </svg>
                <span class="logo-text">Novexium</span>
            </a>
            <h1 class="auth-title">Create new password</h1>
            <p class="auth-subtitle">
                Enter your new password below
            </p>
        </div>
        
        {% if error %}
        <div class="auth-error">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/>
                <line x1="12" y1="8" x2="12" y2="12"/>
                <line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
            <span>{{ error }}</span>
        </div>
        {% endif %}
        
        <form class="auth-form" method="POST" action="/auth/reset-password/{{ token }}" id="resetPasswordForm" novalidate>
            <input type="hidden" name="token" value="{{ token }}">
            
            <div class="form-group">
                <label class="form-label" for="password">New Password</label>
                <div class="password-input-wrapper">
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        class="input" 
                        placeholder="••••••••"
                        required
                        minlength="8"
                    >
                    <button type="button" class="password-toggle" aria-label="Toggle password visibility">
                        <svg class="password-eye" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>
                </div>
            </div>
            
            <div class="form-group">
                <label class="form-label" for="confirmPassword">Confirm Password</label>
                <div class="password-input-wrapper">
                    <input 
                        type="password" 
                        id="confirmPassword" 
                        name="confirm_password" 
                        class="input" 
                        placeholder="••••••••"
                        required
                    >
                </div>
            </div>
            
            <button type="submit" class="btn-primary btn-block btn-lg" id="resetPasswordButton">
                Reset Password
            </button>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', path='js/auth.js') }}"></script>
{% endblock %}
