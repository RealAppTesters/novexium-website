{% extends "base/dashboard.html" %}

{% block title %}App Workspace — Novexium{% endblock %}

{% block dashboard_content %}
<div class="workspace-container">
    <!-- Navigation -->
    <div class="workspace-nav">
        <div class="workspace-nav-left">
            <button class="workspace-back" onclick="location.href='/apps'">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19L5 12L12 5"/>
                </svg>
                Back to Apps
            </button>
            <div class="workspace-app-info">
                <div class="workspace-app-icon">
                    <img src="{{ app_icon }}" alt="{{ app_name }}">
                </div>
                <div>
                    <h1 class="workspace-app-name">{{ app_name }}</h1>
                    <span class="workspace-app-platform {{ platform }}">{{ platform|title }}</span>
                </div>
            </div>
        </div>
        <div class="workspace-nav-right">
            <button class="btn-secondary btn-sm" onclick="location.href='/apps/{{ app_id }}/settings'">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
                    <circle cx="12" cy="12" r="3"/>
                </svg>
                Settings
            </button>
        </div>
    </div>
    
    <!-- Workspace Content -->
    <div class="workspace-content">
        <!-- Welcome Experience -->
        {% include 'components/apps/_workspace_welcome.html' %}
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', path='js/connect.js') }}"></script>
<script>
    // Animation triggers for workspace
    document.addEventListener('DOMContentLoaded', function() {
        // Trigger score bar animations
        setTimeout(function() {
            document.querySelectorAll('.workspace-score-fill').forEach(function(bar) {
                const width = bar.style.width;
                bar.style.width = '0%';
                setTimeout(function() {
                    bar.style.width = width;
                }, 100);
            });
        }, 500);
        
        // Trigger potential progress animation
        setTimeout(function() {
            const progress = document.querySelector('.workspace-potential-progress-fill');
            if (progress) {
                const width = progress.style.width;
                progress.style.width = '0%';
                setTimeout(function() {
                    progress.style.width = width;
                }, 200);
            }
        }, 800);
        
        // Trigger benchmark bar animation
        setTimeout(function() {
            const bar = document.querySelector('.workspace-benchmark-bar-fill');
            if (bar) {
                const width = bar.style.width;
                bar.style.width = '0%';
                setTimeout(function() {
                    bar.style.width = width;
                }, 300);
            }
        }, 600);
    });
</script>
{% endblock %}
