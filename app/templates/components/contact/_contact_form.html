<section class="contact-form-section" id="form">
    <div class="contact-form-container">
        <div class="contact-form-header">
            <h2 class="contact-form-title">
                Send Us a <span class="contact-form-gradient">Message</span>
            </h2>
            <p class="contact-form-subtitle">
                Fill out the form below and we'll get back to you as soon as possible.
            </p>
        </div>
        
        <form class="contact-form" id="contactForm" novalidate>
            <!-- Name -->
            <div class="contact-form-group">
                <label class="contact-form-label" for="contactName">Full Name</label>
                <input 
                    type="text" 
                    id="contactName" 
                    class="contact-form-input" 
                    placeholder="John Doe"
                    required
                    autofocus
                >
                <span class="contact-form-error" id="nameError">Please enter your name</span>
            </div>
            
            <!-- Email -->
            <div class="contact-form-group">
                <label class="contact-form-label" for="contactEmail">Email Address</label>
                <input 
                    type="email" 
                    id="contactEmail" 
                    class="contact-form-input" 
                    placeholder="you@example.com"
                    required
                >
                <span class="contact-form-error" id="emailError">Please enter a valid email</span>
            </div>
            
            <!-- Company -->
            <div class="contact-form-group">
                <label class="contact-form-label" for="contactCompany">Company (Optional)</label>
                <input 
                    type="text" 
                    id="contactCompany" 
                    class="contact-form-input" 
                    placeholder="Your company name"
                >
            </div>
            
            <!-- Subject -->
            <div class="contact-form-group">
                <label class="contact-form-label" for="contactSubject">Subject</label>
                <input 
                    type="text" 
                    id="contactSubject" 
                    class="contact-form-input" 
                    placeholder="What's this about?"
                    required
                >
                <span class="contact-form-error" id="subjectError">Please enter a subject</span>
            </div>
            
            <!-- Category -->
            <div class="contact-form-group">
                <label class="contact-form-label" for="contactCategory">Category</label>
                <select id="contactCategory" class="contact-form-select">
                    <option value="general">General Question</option>
                    <option value="support">Technical Support</option>
                    <option value="billing">Billing</option>
                    <option value="sales">Sales</option>
                    <option value="feature">Feature Request</option>
                    <option value="partnership">Partnership</option>
                    <option value="other">Other</option>
                </select>
            </div>
            
            <!-- Message -->
            <div class="contact-form-group">
                <label class="contact-form-label" for="contactMessage">Message</label>
                <textarea 
                    id="contactMessage" 
                    class="contact-form-textarea" 
                    rows="5" 
                    placeholder="How can we help you?"
                    required
                ></textarea>
                <span class="contact-form-error" id="messageError">Please enter your message</span>
            </div>
            
            <!-- Submit -->
            <div class="contact-form-actions">
                <button type="submit" class="btn-primary btn-lg" id="contactSubmit">
                    <span class="contact-submit-text">Send Message</span>
                    <span class="contact-submit-loading" style="display: none;">
                        <span class="spinner-small"></span>
                        Sending...
                    </span>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
                    </svg>
                </button>
            </div>
            
            <!-- Success Message -->
            <div class="contact-form-success" id="contactSuccess" style="display: none;">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#22C55E" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/>
                    <polyline points="9 12 11 14 15 10"/>
                </svg>
                <h4>Message Sent!</h4>
                <p>Thank you for reaching out. We'll get back to you as soon as possible.</p>
            </div>
        </form>
    </div>
</section>
