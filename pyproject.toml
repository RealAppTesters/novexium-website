[project]
name = "novexium"
version = "1.0.0"
description = "Novexium - App Growth Platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "alembic",
    "psycopg2-binary",
    "redis",
    "celery",
    "python-jose[cryptography]",
    "passlib[bcrypt]",
    "python-multipart",
    "jinja2",
    "pydantic",
    "pydantic-settings",
    "email-validator",
    "python-dotenv",
    "httpx"
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.vercel]
entrypoint = "app.main:app"
